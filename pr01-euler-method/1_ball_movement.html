<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>1.3 Движение шарика слева направо</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; background: #f4f4f4; }
  canvas { border: 1px solid #999; }
</style>
</head>
<body>
<h2>Движение шарика по горизонтали (слева направо)</h2>
<p>Простейшая кинематическая модель: x(t+dt) = x(t) + v*dt</p>
<script>

let x, y, speed;

function setup() {
  createCanvas(600, 200);
  x = 20;              // начальная позиция
  y = height / 2;
  speed = 3;            // скорость движения, px за кадр
}

function draw() {
  background(240);

  // модель: на каждом кадре (шаге по времени) координата увеличивается на скорость
  x += speed;

  // как только шарик выходит за правый край - возвращаем его в начало
  if (x > width + 20) {
    x = -20;
  }

  fill(30, 100, 220);
  noStroke();
  circle(x, y, 30);

  fill(0);
  text('x = ' + x.toFixed(1), 10, 20);
}
</script>
</body>
</html>
